name: citrus
description: "Citrus - Windows-first file conversion and editing utility"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Image processing
  image: ^4.1.7
  
  # File handling
  path: ^1.9.0
  mime: ^1.0.4
  
  # State management
  provider: ^6.1.2
  
  # JSON serialization
  json_annotation: ^4.9.0
  
  # Settings/preferences
  shared_preferences: ^2.2.3
  
  # File picking (Windows native dialogs)
  file_selector: ^1.0.2
  
  # System tray
  system_tray: ^2.0.3
  
  # Window management
  window_manager: ^0.3.8
  
  # Logging
  logging: ^1.2.0
  
  # UUID for job IDs
  uuid: ^3.0.7
  
  # Path provider for temp directories
  path_provider: ^2.1.3
  
  # Global shortcuts (for future phases)
  # hotkey_manager: ^0.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.9
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  # Custom fonts can be added here later